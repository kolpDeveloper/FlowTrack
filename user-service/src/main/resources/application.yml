spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://postgres:5432/flow-track
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  data:
    redis:
      timeout: 2000ms
      host: redis
      port: 6379
  main:
    allow-bean-definition-overriding: true

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:MATSUMOTO}
  expiration: 7d